<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" id="outerThemeColor" content="#216347">
  <title>新湖 進貨/領料 系統(TEST)</title>

  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">

  <meta name="application-name" content="新湖進領料">
  <meta name="apple-mobile-web-app-title" content="新湖進領料">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link id="appFavicon" rel="icon" type="image/png">
  <link id="appleTouchIcon" rel="apple-touch-icon" sizes="180x180">
  <script>
    (function initOuterAppIcon() {
      try {
        function drawRoundedRectPath(ctx, x, y, w, h, r) {
          if (typeof ctx.roundRect === "function") {
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, r);
            return;
          }
          const radius = Math.min(r, w / 2, h / 2);
          ctx.beginPath();
          ctx.moveTo(x + radius, y);
          ctx.arcTo(x + w, y, x + w, y + h, radius);
          ctx.arcTo(x + w, y + h, x, y + h, radius);
          ctx.arcTo(x, y + h, x, y, radius);
          ctx.arcTo(x, y, x + w, y, radius);
          ctx.closePath();
        }

        function createStyledIcon(size) {
          const canvas = document.createElement("canvas");
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext("2d");
          if (!ctx) return "";

          const s = size / 180;
          ctx.save();
          ctx.scale(s, s);

          // 背景深綠漸層
          const bgGrad = ctx.createLinearGradient(0, 0, 180, 180);
          bgGrad.addColorStop(0, "#2f9468");
          bgGrad.addColorStop(0.55, "#216347");
          bgGrad.addColorStop(1, "#133a29");
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, 180, 180);

          // 右上角微光暈
          const glowGrad = ctx.createRadialGradient(142, 34, 6, 142, 34, 85);
          glowGrad.addColorStop(0, "rgba(167, 243, 208, 0.34)");
          glowGrad.addColorStop(1, "rgba(167, 243, 208, 0)");
          ctx.fillStyle = glowGrad;
          ctx.fillRect(0, 0, 180, 180);

          // 中央徽章框
          ctx.fillStyle = "rgba(255, 255, 255, 0.12)";
          ctx.strokeStyle = "rgba(255, 255, 255, 0.28)";
          ctx.lineWidth = 2;
          drawRoundedRectPath(ctx, 22, 34, 136, 112, 26);
          ctx.fill();
          ctx.stroke();

          // 上方小標誌字樣
          ctx.fillStyle = "rgba(220, 252, 231, 0.9)";
          ctx.font = "700 16px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("進領料管理", 90, 58);

          // 主標題「新湖」
          ctx.save();
          ctx.shadowColor = "rgba(0, 0, 0, 0.28)";
          ctx.shadowBlur = 8;
          ctx.shadowOffsetY = 3;
          ctx.fillStyle = "#ffffff";
          ctx.font = "900 50px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("新湖", 90, 104);
          ctx.restore();

          ctx.restore();
          return canvas.toDataURL("image/png");
        }

        const icon180 = createStyledIcon(180);
        const icon512 = createStyledIcon(512);

        const favEl = document.getElementById("appFavicon");
        const appleEl = document.getElementById("appleTouchIcon");
        if (favEl && icon512) favEl.href = icon512;
        if (appleEl && icon180) appleEl.href = icon180;
      } catch (e) {}
    })();
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background-color: #216347;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    .shell-frame {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
    }
    .gas-iframe {
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .loading-mask {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #216347 0%, #2d805c 100%);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      z-index: 10;
      opacity: 1;
      transition: opacity 0.25s ease;
    }
    .loading-mask.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loading-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .outer-bottom-bar {
      flex-shrink: 0;
      width: 100%;
      height: max(env(safe-area-inset-bottom, 0px), 18px);
      background: linear-gradient(135deg, #216347 0%, #2d805c 100%);
      transition: background 0.15s ease, background-color 0.15s ease;
    }
  </style>
</head>
<body>
  <div class="shell-frame">
    <div id="loadingMask" class="loading-mask">
      <div class="loading-spinner" aria-hidden="true"></div>
      <div>連線新湖進領料系統中...</div>
    </div>
    <iframe
      id="gasAppFrame"
      class="gas-iframe"
      src="https://script.google.com/macros/s/AKfycbwmPVy-p_j60QtWAgHTHKCOjnn7Hkg1X6aG4YywhJ3itFZLykeyjb1NCiD5dJQuxZSL/exec"
      allow="camera; microphone"
      referrerpolicy="no-referrer"
      onload="hideLoadingMask()"
    ></iframe>
    <div id="outerBottomBar" class="outer-bottom-bar"></div>
  </div>

  <script>
    function hideLoadingMask() {
      const mask = document.getElementById("loadingMask");
      if (mask) mask.classList.add("is-hidden");
    }

    function applyThemeToOuter(data) {
      if (!data) return;
      const solid = data.solidColor || "#216347";
      const grad = data.gradient || solid;

      document.documentElement.style.background = solid;
      document.documentElement.style.backgroundColor = solid;
      document.body.style.background = solid;
      document.body.style.backgroundColor = solid;

      const metaEl = document.getElementById("outerThemeColor");
      if (metaEl) metaEl.setAttribute("content", solid);

      const bottomBar = document.getElementById("outerBottomBar");
      if (bottomBar) {
        bottomBar.style.background = "none";
        bottomBar.style.backgroundColor = solid;
        bottomBar.style.backgroundImage = grad.includes("gradient") ? grad : "none";
      }
    }

    window.addEventListener("message", function(event) {
      const data = event.data;
      if (!data || data.type !== "XINHU_THEME_SYNC") return;
      applyThemeToOuter(data);
    });
  </script>
</body>
</html>
