<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" id="outerThemeColor" content="#216347">
  <title>新湖 進貨/領料 系統(TEST)</title>

  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">

  <meta name="application-name" content="新湖進領料">
  <meta name="apple-mobile-web-app-title" content="新湖進領料">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link id="appFavicon" rel="icon" type="image/png">
  <link id="appleTouchIcon" rel="apple-touch-icon" sizes="180x180">
  <script>
    (function initOuterAppIcon() {
      try {
        var canvas = document.createElement("canvas");
        canvas.width = 180;
        canvas.height = 180;
        var ctx = canvas.getContext("2d");
        if (!ctx) return;
        var bgGrad = ctx.createLinearGradient(0, 0, 180, 180);
        bgGrad.addColorStop(0, "#2d805c");
        bgGrad.addColorStop(0.55, "#216347");
        bgGrad.addColorStop(1, "#184733");
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, 180, 180);
        ctx.fillStyle = "#ffffff";
        ctx.font = "900 42px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("新湖", 90, 95);

        var icon180 = canvas.toDataURL("image/png");
        var favEl = document.getElementById("appFavicon");
        var appleEl = document.getElementById("appleTouchIcon");
        if (favEl) favEl.href = icon180;
        if (appleEl) appleEl.href = icon180;
      } catch (e) {}
    })();
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #216347;
      transition: background-color 0.2s ease;
    }
    .shell-frame {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    .gas-iframe {
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* 外層底部安全區色條，隨內層主題同步變色 */
    .outer-bottom-bar {
      flex-shrink: 0;
      width: 100%;
      height: env(safe-area-inset-bottom, 0px);
      background: linear-gradient(135deg, #216347 0%, #2d805c 100%);
      transition: background 0.2s ease;
    }
  </style>
</head>
<body>
  <div class="shell-frame">
    <!-- 請將下方 src 替換為你實際的 Google Apps Script 網頁應用程式網址 -->
    <iframe id="gasAppFrame" class="gas-iframe" src="https://script.google.com/macros/s/AKfycbwmPVy-p_j60QtWAgHTHKCOjnn7Hkg1X6aG4YywhJ3itFZLykeyjb1NCiD5dJQuxZSL/exec" allow="camera; microphone"></iframe>
    <div id="outerBottomBar" class="outer-bottom-bar"></div>
  </div>

  <script>
    window.addEventListener("message", function(event) {
      var data = event.data;
      if (!data || data.type !== "XINHU_THEME_SYNC") return;

      if (data.solidColor) {
        document.documentElement.style.backgroundColor = data.solidColor;
        document.body.style.backgroundColor = data.solidColor;
        var metaEl = document.getElementById("outerThemeColor");
        if (metaEl) metaEl.setAttribute("content", data.solidColor);
      }
      var bottomBar = document.getElementById("outerBottomBar");
      if (bottomBar && data.gradient) {
        bottomBar.style.background = data.gradient;
      }
    });
  </script>
</body>
</html>
