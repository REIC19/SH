<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" id="outerThemeColor" content="#216347">
  <title>新湖 進貨/領料 系統(TEST)</title>

  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">

  <meta name="application-name" content="新湖進領料">
  <meta name="apple-mobile-web-app-title" content="新湖進領料">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link id="appFavicon" rel="icon" type="image/png">
  <link id="appleTouchIcon" rel="apple-touch-icon" sizes="180x180">
  <script>
    (function initOuterAppIcon() {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = 180;
        canvas.height = 180;
        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        const bgGrad = ctx.createLinearGradient(0, 0, 180, 180);
        bgGrad.addColorStop(0, "#2d805c");
        bgGrad.addColorStop(0.55, "#216347");
        bgGrad.addColorStop(1, "#184733");
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, 180, 180);

        ctx.fillStyle = "#ffffff";
        ctx.font = "900 42px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("新湖", 90, 95);

        const icon180 = canvas.toDataURL("image/png");
        ["appFavicon", "appleTouchIcon"].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.href = icon180;
        });
      } catch (e) {}
    })();
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #216347;
      transition: background-color 0.2s ease;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    .shell-frame {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    .gas-iframe {
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .loading-mask {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #216347 0%, #2d805c 100%);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      z-index: 10;
      opacity: 1;
      transition: opacity 0.25s ease;
    }
    .loading-mask.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loading-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .outer-bottom-bar {
      flex-shrink: 0;
      width: 100%;
      height: env(safe-area-inset-bottom, 0px);
      background: linear-gradient(135deg, #216347 0%, #2d805c 100%);
      transition: background 0.2s ease;
    }
  </style>
</head>
<body>
  <div class="shell-frame">
    <div id="loadingMask" class="loading-mask">
      <div class="loading-spinner" aria-hidden="true"></div>
      <div>連線新湖進領料系統中...</div>
    </div>
    <iframe
      id="gasAppFrame"
      class="gas-iframe"
      src="https://script.google.com/macros/s/AKfycbwmPVy-p_j60QtWAgHTHKCOjnn7Hkg1X6aG4YywhJ3itFZLykeyjb1NCiD5dJQuxZSL/exec"
      allow="camera; microphone"
      referrerpolicy="no-referrer"
      onload="hideLoadingMask()"
    ></iframe>
    <div id="outerBottomBar" class="outer-bottom-bar"></div>
  </div>

  <script>
    function hideLoadingMask() {
      const mask = document.getElementById("loadingMask");
      if (mask) mask.classList.add("is-hidden");
    }

    const ALLOWED_ORIGINS = [
      "https://script.google.com",
      "https://script.googleusercontent.com",
      window.location.origin
    ];

    window.addEventListener("message", function(event) {
      if (!ALLOWED_ORIGINS.includes(event.origin)) return;
      const data = event.data;
      if (!data || data.type !== "XINHU_THEME_SYNC") return;

      if (data.solidColor) {
        document.documentElement.style.backgroundColor = data.solidColor;
        document.body.style.backgroundColor = data.solidColor;
        const metaEl = document.getElementById("outerThemeColor");
        if (metaEl) metaEl.setAttribute("content", data.solidColor);
      }
      const bottomBar = document.getElementById("outerBottomBar");
      if (bottomBar && data.gradient) {
        bottomBar.style.background = data.gradient;
      }
    });
  </script>
</body>
</html>
