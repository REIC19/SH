<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" id="outerThemeColor" content="#216347">
  <title>新湖 進貨/領料 系統(TEST)</title>

  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">

  <meta name="application-name" content="新湖進領料">
  <meta name="apple-mobile-web-app-title" content="新湖進領料">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link id="appFavicon" rel="icon" type="image/png">
  <link id="appleTouchIcon" rel="apple-touch-icon" sizes="180x180">
  <script>
    (function initOuterAppIcon() {
      try {
        function createStyledIcon(size) {
          const canvas = document.createElement("canvas");
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext("2d");
          if (!ctx) return "";

          const s = size / 180;
          ctx.save();
          ctx.scale(s, s);

          // 明亮草綠與薄荷綠漸層底色
          const bgGrad = ctx.createLinearGradient(20, 10, 165, 175);
          bgGrad.addColorStop(0, "#4ce096");
          bgGrad.addColorStop(0.5, "#24b866");
          bgGrad.addColorStop(1, "#128748");
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, 180, 180);

          // 中心薄荷亮光，提亮「新湖」字體周圍
          const centerGlow = ctx.createRadialGradient(90, 86, 10, 90, 90, 98);
          centerGlow.addColorStop(0, "rgba(209, 250, 229, 0.34)");
          centerGlow.addColorStop(1, "rgba(18, 135, 72, 0)");
          ctx.fillStyle = centerGlow;
          ctx.fillRect(0, 0, 180, 180);

          // 造型字體設定：超大粗體、微傾斜、深綠立體描邊與陰影
          const fontStack = '"Arial Black", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif';
          ctx.font = `900 68px ${fontStack}`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          ctx.translate(90, 93);
          ctx.rotate(-0.03);

          ctx.lineJoin = "round";
          ctx.lineWidth = 7;
          ctx.strokeStyle = "#0b522c";
          ctx.strokeText("新湖", 0, 2);

          ctx.shadowColor = "rgba(8, 56, 30, 0.45)";
          ctx.shadowBlur = 10;
          ctx.shadowOffsetX = 0;
          ctx.shadowOffsetY = 5;

          // 白色主字體
          ctx.fillStyle = "#ffffff";
          ctx.fillText("新湖", 0, 0);

          ctx.restore();
          return canvas.toDataURL("image/png");
        }

        const icon180 = createStyledIcon(180);
        const icon512 = createStyledIcon(512);

        const favEl = document.getElementById("appFavicon");
        const appleEl = document.getElementById("appleTouchIcon");
        if (favEl && icon512) favEl.href = icon512;
        if (appleEl && icon180) appleEl.href = icon180;
      } catch (e) {}
    })();
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background-color: #216347;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    .shell-frame {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
    }
    .gas-iframe {
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .loading-mask {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #216347 0%, #2d805c 100%);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      z-index: 10;
      opacity: 1;
      transition: opacity 0.25s ease;
    }
    .loading-mask.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loading-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .outer-bottom-bar {
      flex-shrink: 0;
      width: 100%;
      height: max(env(safe-area-inset-bottom, 0px), 18px);
      background: linear-gradient(135deg, #216347 0%, #2d805c 100%);
      transition: background 0.15s ease, background-color 0.15s ease;
    }
  </style>
</head>
<body>
  <div class="shell-frame">
    <div id="loadingMask" class="loading-mask">
      <div class="loading-spinner" aria-hidden="true"></div>
      <div>連線新湖進領料系統中...</div>
    </div>
    <iframe
      id="gasAppFrame"
      class="gas-iframe"
      src="https://script.google.com/macros/s/AKfycbwmPVy-p_j60QtWAgHTHKCOjnn7Hkg1X6aG4YywhJ3itFZLykeyjb1NCiD5dJQuxZSL/exec"
      allow="camera; microphone"
      referrerpolicy="no-referrer"
      onload="hideLoadingMask()"
    ></iframe>
    <div id="outerBottomBar" class="outer-bottom-bar"></div>
  </div>

  <script>
    function hideLoadingMask() {
      const mask = document.getElementById("loadingMask");
      if (mask) mask.classList.add("is-hidden");
    }

    function applyThemeToOuter(data) {
      if (!data) return;
      const solid = data.solidColor || "#216347";
      const grad = data.gradient || solid;

      document.documentElement.style.background = solid;
      document.documentElement.style.backgroundColor = solid;
      document.body.style.background = solid;
      document.body.style.backgroundColor = solid;

      const metaEl = document.getElementById("outerThemeColor");
      if (metaEl) metaEl.setAttribute("content", solid);

      const bottomBar = document.getElementById("outerBottomBar");
      if (bottomBar) {
        bottomBar.style.background = "none";
        bottomBar.style.backgroundColor = solid;
        bottomBar.style.backgroundImage = grad.includes("gradient") ? grad : "none";
      }
    }

    window.addEventListener("message", function(event) {
      const data = event.data;
      if (!data || data.type !== "XINHU_THEME_SYNC") return;
      applyThemeToOuter(data);
    });
  </script>
</body>
</html>
