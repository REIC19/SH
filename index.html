<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta id="metaThemeColor" name="theme-color" content="#216347">
  <title>新湖 進貨/領料 系統(TEST)</title>

  <meta name="application-name" content="新湖進領料">
  <meta name="apple-mobile-web-app-title" content="新湖進領料">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <link id="appFavicon" rel="icon" type="image/png">
  <link id="appleTouchIcon" rel="apple-touch-icon" sizes="180x180">
  <script>
    (function buildAppIcon() {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = 180;
        canvas.height = 180;
        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        const grad = ctx.createLinearGradient(0, 0, 180, 180);
        grad.addColorStop(0, "#7ee0a8");
        grad.addColorStop(1, "#3ba86b");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 180, 180);

        ctx.fillStyle = "#123824";
        ctx.font = "900 64px 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("新湖", 90, 94);

        const dataUrl = canvas.toDataURL("image/png");
        document.getElementById("appFavicon").href = dataUrl;
        document.getElementById("appleTouchIcon").href = dataUrl;
      } catch (e) {}
    })();
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #216347;
      transition: background-color 0.2s ease;
    }
    .gas-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background-color: #eef5f1;
    }
  </style>
</head>
<body>
  <!-- 注意：如果下方 src 的網址與你 GAS「管理部署作業」中的最新 /exec 網址不同，請替換成你最新的 /exec 網址 -->
  <iframe
    id="gasAppFrame"
    class="gas-frame"
    src="https://script.google.com/macros/s/AKfycbwmPVy-p_j60QtWAgHTHKCOjnn7Hkg1X6aG4YywhJ3itFZLykeyjb1NCiD5dJQuxZSL/exec"
    allow="camera; microphone; geolocation"
    allowfullscreen>
  </iframe>

  <script>
    window.addEventListener("message", function (event) {
      if (!event.data || event.data.type !== "XINHU_THEME_SYNC") return;
      const color = event.data.solidColor || "#216347";
      document.documentElement.style.backgroundColor = color;
      document.body.style.backgroundColor = color;
      const meta = document.getElementById("metaThemeColor");
      if (meta) meta.setAttribute("content", color);
    });
  </script>
</body>
</html>
